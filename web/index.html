<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0c0f" />
<link rel="manifest" href="manifest.json" />
<title>Cerne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#aab4c2;            /* fundo cinza-azulado atrás do app */
  --app:#0c0e12;             /* moldura do app */
  --bg:#0a0c0f;              /* fundo interno */
  --col:#0e1116;             /* coluna */
  --card:#14171d;            /* card */
  --card-hover:#181c23;
  --line:#1d222b;            /* bordas */
  --line-soft:#161a21;
  --ink:#eef1f6;
  --ink-2:#9aa3b2;
  --ink-3:#6b7382;
  --ink-4:#4b5260;
  --blue:#2f6bff;
  --blue-hi:#4480ff;
  --radius-app:26px;
  --radius:16px;
  --radius-sm:11px;
  --radius-xs:8px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 30% -10%, #b9c2cf 0%, transparent 60%),
    var(--stage);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  padding:22px;overscroll-behavior:none;
}

/* ============ moldura do app ============ */
.app{
  width:100%;max-width:1320px;height:calc(100dvh - 44px);max-height:860px;
  background:var(--app);border-radius:var(--radius-app);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03);
  display:grid;grid-template-columns:64px 1fr 312px;overflow:hidden;
  animation:appIn .7s var(--ease) both;
}
@keyframes appIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
@media(max-width:1000px){
  body{padding:0}
  .app{max-width:none;max-height:none;height:100dvh;border-radius:0;
       grid-template-columns:1fr;box-shadow:none}
  .app .rail{display:none !important}
  .app .activity{display:none !important}
}

/* ============ sidebar rail ============ */
.rail{
  background:var(--app);border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:18px 0;
}
.rail .logo{
  width:34px;height:34px;border-radius:50%;margin-bottom:14px;
  background:conic-gradient(from 210deg,#2f6bff,#7aa2ff,#fff,#2f6bff);
  box-shadow:0 0 0 1px rgba(255,255,255,.08);
}
.rail button{
  width:40px;height:40px;border:none;background:transparent;color:var(--ink-3);
  border-radius:11px;cursor:pointer;display:grid;place-items:center;
  transition:.2s var(--ease);position:relative;
}
.rail button:hover{color:var(--ink);background:#141821}
.rail button.on{color:var(--ink);background:#181d27}
.rail button.on::before{content:"";position:absolute;left:-18px;top:11px;bottom:11px;
  width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
.rail svg{width:19px;height:19px}
.rail .sp{flex:1}
.rail .me{width:34px;height:34px;border-radius:50%;
  background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="%23223"/><circle cx="20" cy="16" r="7" fill="%23889"/><rect x="8" y="26" width="24" height="14" rx="7" fill="%23889"/></svg>') center/cover;
  box-shadow:0 0 0 1px rgba(255,255,255,.08)}

/* ============ centro ============ */
.center{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{
  display:flex;align-items:center;gap:18px;padding:18px 22px 16px;
}
.topbar h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;margin:0 auto;background:#0e1117;border:1px solid var(--line-soft);
  padding:4px;border-radius:12px}
.tab{display:flex;align-items:center;gap:7px;font:inherit;font-size:13px;font-weight:500;
  color:var(--ink-3);background:transparent;border:none;cursor:pointer;
  padding:7px 14px;border-radius:9px;transition:.2s var(--ease)}
.tab svg{width:15px;height:15px}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink);background:#1b202b;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.add{display:flex;align-items:center;gap:8px;font:inherit;font-size:13.5px;font-weight:600;
  color:#fff;background:var(--blue);border:none;cursor:pointer;
  padding:9px 16px;border-radius:11px;transition:.2s var(--ease);
  box-shadow:0 6px 16px -6px rgba(47,107,255,.7)}
.add:hover{background:var(--blue-hi);transform:translateY(-1px)}
.add:active{transform:translateY(0)}
.add svg{width:16px;height:16px}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:#0e1117;color:var(--ink-3);
  border-radius:11px;cursor:pointer;display:grid;place-items:center;transition:.2s}
.iconbtn:hover{color:var(--ink);border-color:#2a313d}
.iconbtn svg{width:17px;height:17px}

.toolbar{display:flex;align-items:center;gap:14px;padding:0 22px 14px}
.search{flex:1;display:flex;align-items:center;gap:10px;background:#0e1117;
  border:1px solid var(--line-soft);border-radius:11px;padding:10px 14px;max-width:none}
.search svg{width:16px;height:16px;color:var(--ink-4)}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:13.5px}
.search input::placeholder{color:var(--ink-4)}
.tool{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink-3);
  background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;transition:.2s}
.tool:hover{color:var(--ink)}
.tool svg{width:15px;height:15px}

/* ============ board ============ */
.board{display:flex;gap:16px;padding:4px 22px 22px;overflow-x:auto;overflow-y:hidden;flex:1;
  scroll-snap-type:x proximity}
.board::-webkit-scrollbar{height:8px}
.board::-webkit-scrollbar-thumb{background:#1d222b;border-radius:8px}
.col{flex:0 0 296px;max-width:90vw;display:flex;flex-direction:column;min-height:0;scroll-snap-align:start;
  animation:colIn .55s var(--ease) both}
.col:nth-child(1){animation-delay:.05s}.col:nth-child(2){animation-delay:.12s}
.col:nth-child(3){animation-delay:.19s}.col:nth-child(4){animation-delay:.26s}
@keyframes colIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.col-head{display:flex;align-items:center;gap:9px;padding:7px 11px;margin-bottom:12px;
  background:#11141a;border:1px solid var(--line-soft);border-radius:11px;width:max-content}
.col-head .bub{width:8px;height:8px;border-radius:50%}
.col-head h2{font-size:13.5px;font-weight:600}
.col-head .ct{color:var(--ink-3);font-weight:600}
.col-body{display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1;padding:3px 3px 60px;margin:-3px}
.col-body::-webkit-scrollbar{width:7px}
.col-body::-webkit-scrollbar-thumb{background:#1a1f28;border-radius:8px}
.col-body.drop{outline:2px dashed rgba(47,107,255,.5);outline-offset:3px;border-radius:14px}

/* ============ card ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;cursor:pointer;transition:transform .22s var(--ease),border-color .2s,box-shadow .22s;
  animation:cardIn .5s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px);border-color:#2b323f;background:var(--card-hover);
  box-shadow:0 14px 30px -16px rgba(0,0,0,.7)}
.card.dragging{opacity:.45;cursor:grabbing}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.label{font-size:11px;font-weight:600;padding:4px 10px;border-radius:7px;letter-spacing:.01em}
.due{font-size:11.5px;font-weight:500;color:var(--ink-3)}
.due.soon{color:#f0a93a}
.card h3{font-size:14.5px;font-weight:600;line-height:1.34;letter-spacing:-.01em}
.card .desc{color:var(--ink-3);font-size:12.5px;line-height:1.5;margin-top:7px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.thumbs{display:flex;gap:8px;margin-top:12px}
.thumb{height:62px;flex:1;border-radius:9px;border:1px solid var(--line);
  background:linear-gradient(135deg,#1b2230,#10141c);position:relative;overflow:hidden}
.thumb.more{flex:0 0 44px;display:grid;place-items:center;color:var(--ink-2);font-size:12px;font-weight:600;
  background:#11141a}
.card-foot{display:flex;align-items:center;margin-top:13px;gap:10px}
.avatars{display:flex}
.avatars .av{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);
  margin-left:-8px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.avatars .av:first-child{margin-left:0}
.av-add{width:26px;height:26px;border-radius:50%;border:1px dashed var(--ink-4);color:var(--ink-4);
  display:grid;place-items:center;font-size:13px}
.acts{display:flex;gap:5px;margin-left:auto}
.acts span{width:28px;height:28px;border-radius:8px;border:1px solid var(--line-soft);
  display:grid;place-items:center;color:var(--ink-3);transition:.18s;background:#10131a}
.acts span:hover{color:var(--ink);border-color:#2a313d}
.acts svg{width:14px;height:14px}
.empty{color:var(--ink-4);font-size:12.5px;text-align:center;padding:22px 0;border:1px dashed var(--line);
  border-radius:12px}

/* ============ painel direito ============ */
.activity{background:var(--app);border-left:1px solid var(--line-soft);
  display:flex;flex-direction:column;padding:18px 18px 0;overflow:hidden}
.act-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.act-head h2{font-size:15px;font-weight:600}
.act-head .bell{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:#0e1117;display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.act-head .bell svg{width:16px;height:16px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.sec-title h3{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.sec-title .cal{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-3)}
.sec-title .cal svg{width:15px;height:15px}
/* legenda heatmap */
.legend{display:flex;gap:14px;margin-bottom:12px;font-size:11px;color:var(--ink-3)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
/* heatmap */
.heat{position:relative;background:#0e1117;border:1px solid var(--line-soft);border-radius:14px;
  padding:14px;margin-bottom:8px}
.heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat-grid i{aspect-ratio:1;border-radius:5px;background:#161b24;transition:.4s var(--ease)}
.heat .bubble{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#0a0c0f;border:1px solid var(--line);border-radius:9px;padding:6px 12px;
  font-size:12px;font-weight:600;box-shadow:0 8px 20px -8px rgba(0,0,0,.8)}
.heat-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:9px;
  font-size:10px;color:var(--ink-4);text-align:center}
/* inbox */
.inbox-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 6px}
.inbox-head h3{font-size:13.5px;font-weight:600}
.inbox-head .when{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.feed{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin:0 -6px;padding:6px}
.feed::-webkit-scrollbar{width:6px}.feed::-webkit-scrollbar-thumb{background:#1a1f28;border-radius:6px}
.item{display:flex;gap:11px;padding:11px 8px;border-radius:11px;transition:.18s;cursor:default;
  animation:cardIn .5s var(--ease) both}
.item:hover{background:#11141a}
.item .av{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff}
.item .body{flex:1;min-width:0}
.item .body .top{display:flex;justify-content:space-between;gap:8px}
.item .body .nm{font-size:12.5px;font-weight:600}
.item .body .tm{font-size:11px;color:var(--ink-4);flex:0 0 auto}
.item .body .tx{font-size:12px;color:var(--ink-3);line-height:1.45;margin-top:2px}
.item .body .tx b{color:var(--blue-hi);font-weight:500}
/* timer */
.timer{margin:8px -18px 0;padding:16px 18px 18px;border-top:1px solid var(--line-soft);
  display:flex;align-items:center;gap:14px}
.timer .lbl{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.timer .clock{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.timer .play{margin-left:auto;width:50px;height:50px;border-radius:14px;border:none;cursor:pointer;
  background:var(--blue);color:#fff;display:grid;place-items:center;transition:.2s var(--ease);
  box-shadow:0 8px 20px -8px rgba(47,107,255,.8)}
.timer .play:hover{background:var(--blue-hi);transform:scale(1.05)}
.timer .play svg{width:20px;height:20px}

/* ============ modais ============ */
.scrim{position:fixed;inset:0;background:rgba(5,7,11,.66);backdrop-filter:blur(5px);
  z-index:60;display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s}
.scrim.open{display:flex;opacity:1}
.modal{background:var(--col);border:1px solid var(--line);border-radius:20px;width:100%;max-width:470px;
  max-height:88dvh;overflow-y:auto;padding:24px;transform:scale(.94) translateY(14px);opacity:0}
.scrim.open .modal{animation:modalIn .4s var(--spring) forwards}
@keyframes modalIn{to{transform:none;opacity:1}}
.modal h2{font-size:18px;font-weight:600;margin-bottom:20px;letter-spacing:-.01em}
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-3);margin-bottom:7px;
  text-transform:uppercase;letter-spacing:.05em}
.field input,.field textarea,.field select{width:100%;font:inherit;font-size:14px;background:var(--bg);
  border:1px solid var(--line);color:var(--ink);padding:11px 13px;border-radius:11px;outline:none;transition:.2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(47,107,255,.15)}
.field textarea{resize:vertical;min-height:78px}
.row2{display:flex;gap:12px}.row2>*{flex:1}
.seg{display:flex;gap:7px}
.seg button{flex:1;font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:9px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink-3);transition:.18s}
.seg button.on{background:rgba(47,107,255,.14);border-color:var(--blue);color:var(--blue-hi)}
.modal-actions{display:flex;gap:10px;margin-top:22px;justify-content:flex-end}
.modal-actions .danger{margin-right:auto;color:#f0604d;border-color:#3a201c;background:transparent}
.btn{font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;border:1px solid var(--line);
  background:#14171d;color:var(--ink);padding:10px 16px;border-radius:11px;transition:.18s}
.btn:hover{border-color:#2a313d}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-hi)}
.btn.ghost{background:transparent}

@media(max-width:1000px){
  .topbar{flex-wrap:wrap}.tabs{order:3;width:100%;margin:6px 0 0}
  .center{height:100dvh}
}
</style>
</head>
<body>
<div class="app">
  <!-- rail -->
  <nav class="rail">
    <div class="logo" title="Cerne"></div>
    <button class="on" title="Início"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></button>
    <button title="Tarefas"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button>
    <button title="Relatórios"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-6M22 20H2"/></svg></button>
    <button title="Calendário"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></button>
    <button title="Mensagens"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
    <button title="Camadas"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></button>
    <span class="sp"></span>
    <button title="Configurações"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3 1a7 7 0 0 0-1.7-1l-.3-2.5h-4l-.3 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.3-1a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg></button>
    <button id="railCfg" title="Sincronização"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
    <div class="me" title="Você"></div>
  </nav>

  <!-- center -->
  <section class="center">
    <div class="topbar">
      <h1 id="boardName">Publications</h1>
      <div class="tabs">
        <button class="tab"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>List</button>
        <button class="tab on"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="11" rx="1.5"/></svg>Board</button>
        <button class="tab"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>Calendar</button>
      </div>
      <button class="add" id="btnNew"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
      <button class="iconbtn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
    </div>
    <div class="toolbar">
      <div class="search"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
        <input id="search" placeholder="Search tasks..." /></div>
      <button class="tool"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters</button>
      <button class="tool"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</button>
      <button class="tool"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>Show</button>
    </div>
    <div class="board" id="board"></div>
  </section>

  <!-- activity -->
  <aside class="activity">
    <div class="act-head"><h2>My Activity</h2>
      <button class="bell"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
    </div>
    <div class="sec-title"><h3>Working Time</h3>
      <span class="cal"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></span>
    </div>
    <div class="legend">
      <span><i style="background:#161b24"></i>0h</span>
      <span><i style="background:#1e3a5f"></i>&gt;2h</span>
      <span><i style="background:#2f6bff"></i>&gt;4h</span>
      <span><i style="background:#7aa2ff"></i>&gt;8h</span>

    </div>

</div>

<!-- modal tarefa -->
<div class="scrim" id="scrimTask">
  <div class="modal">
    <h2 id="taskTitle">New task</h2>
    <input type="hidden" id="f_id" />

      <button class="btn ghost" id="btnCancelCfg">Cancelar</button>
      <button class="btn primary" id="btnSaveCfg">Salvar</button>
    </div>
  </div>
</div>

<script>
/* =================== estado / sync GitHub =================== */
const LS_DB="cerne.db";
let DB=null,Q="";
const DEFAULT_DB={

  ],
  "tarefas": [
    { "id": "t-0001", "titulo": "Mobile App Dashboard Redesign", "descricao": "Redesenhar a UI do dashboard mobile para melhorar usabilidade e clareza visual.", "coluna": "todo", "etiqueta": "Design", "prioridade": "media", "tags": [], "prazo": null, "lembrete": null, "assignees": ["me"], "notaVinculada": null, "criadoEm": "2026-06-16T00:00:00Z", "atualizadoEm": "2026-06-16T00:00:00Z", "concluido": false },
    { "id": "t-0002", "titulo": "Implement Dark Mode Feature", "descricao": "Desenvolver toggle de modo escuro para web e mobile.", "coluna": "todo", "etiqueta": "Development", "prioridade": "baixa", "tags": [], "prazo": null, "lembrete": null, "assignees": ["daniel"], "notaVinculada": null, "criadoEm": "2026-06-16T00:00:00Z", "atualizadoEm": "2026-06-16T00:00:00Z", "concluido": false },
    { "id": "t-0003", "titulo": "SEO Audit And Content Strategy", "descricao": "Auditar o site, achar lacunas de conteúdo e propor estratégia para subir tráfego orgânico em 20%.", "coluna": "todo", "etiqueta": "Marketing", "prioridade": "media", "tags": [], "prazo": null, "lembrete": null, "assignees": ["alex", "anna", "daniel"], "notaVinculada": null, "criadoEm": "2026-06-16T00:00:00Z", "atualizadoEm": "2026-06-16T00:00:00Z", "concluido": false },

    { "id": "t-0005", "titulo": "Case Study: Client Success Story", "descricao": "Escrever um case detalhado mostrando como um cliente teve sucesso usando o produto. Incluir visuais e métricas.", "coluna": "fazendo", "etiqueta": "Content", "prioridade": "media", "tags": [], "prazo": "2026-09-30", "lembrete": null, "assignees": ["daniel"], "notaVinculada": null, "criadoEm": "2026-06-16T00:00:00Z", "atualizadoEm": "2026-06-16T00:00:00Z", "concluido": false },
    { "id": "t-0006", "titulo": "Database Migration To Cloud", "descricao": "Planejar e executar a migração do banco atual para a nuvem com downtime mínimo.", "coluna": "fazendo", "etiqueta": "Development", "prioridade": "alta", "tags": [], "prazo": "2026-09-01", "lembrete": null, "assignees": ["alex", "daniel", "anna"], "notaVinculada": null, "criadoEm": "2026-06-16T00:00:00Z", "atualizadoEm": "2026-06-16T00:00:00Z", "concluido": false },
    { "id": "t-0007", "titulo": "Project Healthcare App", "descricao": "Desenhar um app para ajudar pacientes e médicos a gerenciar consultas, prontuários e acompanhamento de saúde.", "coluna": "revisao", "etiqueta": "Design", "prioridade": "media", "tags": [], "prazo": "2026-10-04", "lembrete": null, "assignees": ["alex"], "notaVinculada": null, "criadoEm": "2026-06-16T00:00:00Z", "atualizadoEm": "2026-06-16T00:00:00Z", "concluido": false },
    { "id": "t-0008", "titulo": "Set Up Automated Testing Suite", "descricao": "Implementar testes automatizados e de integração para os módulos centrais. Cobertura acima de 80%.", "coluna": "revisao", "etiqueta": "Development", "prioridade": "media", "tags": [], "prazo": "2026-10-03", "lembrete": null, "assignees": ["daniel"], "notaVinculada": null, "criadoEm": "2026-06-16T00:00:00Z", "atualizadoEm": "2026-06-16T00:00:00Z", "concluido": false },
    { "id": "t-0009", "titulo": "Podcast Episode Script", "descricao": "Escrever o roteiro do episódio de podcast da empresa com um especialista do setor.", "coluna": "revisao", "etiqueta": "Content", "prioridade": "baixa", "tags": [], "prazo": "2026-10-05", "lembrete": null, "assignees": ["alex", "anna"], "notaVinculada": null, "criadoEm": "2026-06-16T00:00:00Z", "atualizadoEm": "2026-06-16T00:00:00Z", "concluido": false },
    { "id": "t-0010", "titulo": "Optimize Image Compression", "descricao": "Auditar o front-end e implementar compressão e code splitting de imagens.", "coluna": "feito", "etiqueta": "Improvement", "prioridade": "media", "tags": [], "prazo": null, "lembrete": null, "assignees": ["alex"], "notaVinculada": null, "criadoEm": "2026-06-16T00:00:00Z", "atualizadoEm": "2026-06-16T00:00:00Z", "concluido": true }
  ],
  "atividade": [
    { "id": "a1", "pessoa": "alex", "acao": "mudou o status de", "alvo": "Mobile App UI", "extra": "para In Progress", "hora": "18:00" },
    { "id": "a2", "pessoa": "daniel", "acao": "atualizou a descrição de", "alvo": "User onboarding flow", "extra": "", "hora": "17:50" },
    { "id": "a3", "pessoa": "system", "acao": "prazo de", "alvo": "Backend migration", "extra": "é amanhã", "hora": "14:30" },
    { "id": "a4", "pessoa": "anna", "acao": "mencionou você num comentário em", "alvo": "Marketing strategy", "extra": "", "hora": "12:45" }
  ]
};

async function pull(){
  try{
    const r=await fetch('/api/board');
    if(r.ok){DB=await r.json();localStorage.setItem(LS_DB,JSON.stringify(DB));render();return;}
  }catch(e){}
  DB=JSON.parse(localStorage.getItem(LS_DB))||structuredClone(DEFAULT_DB);render();
}
async function push(){
  DB.board.atualizadoEm=new Date().toISOString();
  localStorage.setItem(LS_DB,JSON.stringify(DB));
  try{
    await fetch('/api/board',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(DB)});
  }catch(e){}
}

/* =================== helpers =================== */
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const labelColor=n=>(DB.etiquetas&&DB.etiquetas[n])||"#3b82f6";
function hex2rgba(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function person(id){return (DB.pessoas||[]).find(p=>p.id===id)||{nome:"?",cor:"#555"};}
function initials(n){return n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();}
function fmtDue(d){if(!d)return"";const x=new Date(d);const t=new Date();
  if(x.toDateString()===t.toDateString())return"Due in Today";
  return"Due in "+x.toLocaleDateString("en-US",{month:"short",day:"numeric"});}

/* =================== render board =================== */
const board=document.getElementById("board");
function render(){
  if(!DB)return;
  document.getElementById("boardName").textContent=DB.board.nome||"Board";
  board.innerHTML="";
  DB.colunas.slice().sort((a,b)=>a.ordem-b.ordem).forEach(col=>{
    let ts=DB.tarefas.filter(t=>t.coluna===col.id);
    if(Q)ts=ts.filter(t=>(t.titulo+t.descricao).toLowerCase().includes(Q));
    const sec=document.createElement("div");sec.className="col";
    sec.innerHTML=`<div class="col-head"><span class="bub" style="background:${col.cor}"></span>
        <h2>${esc(col.nome)}</h2><span class="ct">(${ts.length})</span></div>
      <div class="col-body" data-col="${col.id}">
        ${ts.length?ts.map((t,i)=>cardHTML(t,i)).join(""):'<div class="empty">Sem tarefas</div>'}
      </div>`;
    board.appendChild(sec);
  });
  wire();
}
function cardHTML(t,i){
  const lc=labelColor(t.etiqueta);
  const due=t.prazo?fmtDue(t.prazo):"";
  const soon=due.includes("Today");
  const avs=(t.assignees||[]).slice(0,3).map(id=>{const p=person(id);
    return`<span class="av" style="background:${p.cor}">${initials(p.nome)}</span>`}).join("");
  const extra=(t.assignees||[]).length>3?`<span class="av" style="background:#222a36">+${t.assignees.length-3}</span>`:"";
  const addAv=(t.assignees||[]).length===0?'<span class="av-add">+</span>':"";
  return `<article class="card" draggable="true" data-id="${t.id}" style="animation-delay:${i*.05}s">
    <div class="card-top">
      ${t.etiqueta?`<span class="label" style="color:${lc};background:${hex2rgba(lc,.14)}">${esc(t.etiqueta)}</span>`:"<span></span>"}
      ${due?`<span class="due ${soon?'soon':''}">${due}</span>`:""}
    </div>
    <h3>${esc(t.titulo)}</h3>
    ${t.descricao?`<p class="desc">${esc(t.descricao)}</p>`:""}
    <div class="card-foot">
      <div class="avatars">${avs}${extra}${addAv}</div>
      <div class="acts">
        <span title="Comentários"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
        <span title="Anexos"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 12.5 12.5 21a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg></span>
        <span title="Data"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></span>
      </div>
    </div>
  </article>`;
}

/* =================== drag & drop =================== */
let dragId=null;
function wire(){
  document.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("dragstart",e=>{dragId=c.dataset.id;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";});
    c.addEventListener("dragend",()=>c.classList.remove("dragging"));
    c.addEventListener("click",()=>openTask(c.dataset.id));
  });
  document.querySelectorAll(".col-body").forEach(b=>{
    b.addEventListener("dragover",e=>{e.preventDefault();b.classList.add("drop");});
    b.addEventListener("dragleave",()=>b.classList.remove("drop"));
    b.addEventListener("drop",e=>{e.preventDefault();b.classList.remove("drop");
      const t=DB.tarefas.find(x=>x.id===dragId);
      if(t&&t.coluna!==b.dataset.col){t.coluna=b.dataset.col;t.atualizadoEm=new Date().toISOString();
        if(b.dataset.col==="feito")t.concluido=true;render();push();}});
  });
}

/* =================== modal tarefa =================== */
const scrimTask=document.getElementById("scrimTask");let curPrio="media";
function fillSelects(){
  document.getElementById("f_coluna").innerHTML=DB.colunas.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("");
  document.getElementById("f_etiqueta").innerHTML='<option value="">—</option>'+Object.keys(DB.etiquetas||{}).map(k=>`<option value="${k}">${k}</option>`).join("");
}
function openTask(id,colDef){
  fillSelects();const del=document.getElementById("btnDelete");
  if(id){const t=DB.tarefas.find(x=>x.id===id);
    document.getElementById("taskTitle").textContent="Edit task";
    document.getElementById("f_id").value=t.id;
    document.getElementById("f_titulo").value=t.titulo;
    document.getElementById("f_descricao").value=t.descricao||"";
    document.getElementById("f_coluna").value=t.coluna;
    document.getElementById("f_etiqueta").value=t.etiqueta||"";
    document.getElementById("f_prazo").value=t.prazo?t.prazo.slice(0,10):"";
    document.getElementById("f_lembrete").value=t.lembrete?t.lembrete.slice(0,16):"";
    curPrio=t.prioridade||"media";del.style.display="";
  }else{
    document.getElementById("taskTitle").textContent="New task";
    document.getElementById("f_id").value="";["f_titulo","f_descricao","f_prazo","f_lembrete"].forEach(i=>document.getElementById(i).value="");
    document.getElementById("f_coluna").value=colDef||"todo";document.getElementById("f_etiqueta").value="";
    curPrio="media";del.style.display="none";
  }
  document.querySelectorAll("#f_prioridade button").forEach(b=>b.classList.toggle("on",b.dataset.v===curPrio));
  scrimTask.classList.add("open");setTimeout(()=>document.getElementById("f_titulo").focus(),180);
}
document.querySelectorAll("#f_prioridade button").forEach(b=>b.onclick=()=>{curPrio=b.dataset.v;
  document.querySelectorAll("#f_prioridade button").forEach(x=>x.classList.toggle("on",x===b));});
function nextId(){const n=DB.tarefas.map(t=>parseInt((t.id||"").replace("t-",""),10)).filter(x=>!isNaN(x));
  return"t-"+String((n.length?Math.max(...n):0)+1).padStart(4,"0");}
document.getElementById("btnSaveTask").onclick=()=>{
  const titulo=document.getElementById("f_titulo").value.trim();if(!titulo){document.getElementById("f_titulo").focus();return;}
  const id=document.getElementById("f_id").value,now=new Date().toISOString();
  const data={titulo,descricao:document.getElementById("f_descricao").value.trim(),
    coluna:document.getElementById("f_coluna").value,etiqueta:document.getElementById("f_etiqueta").value,
    prioridade:curPrio,prazo:document.getElementById("f_prazo").value||null,
    lembrete:document.getElementById("f_lembrete").value?new Date(document.getElementById("f_lembrete").value).toISOString():null,
    atualizadoEm:now};
  if(id){Object.assign(DB.tarefas.find(x=>x.id===id),data,{concluido:data.coluna==="feito"});}
  else{DB.tarefas.push({id:nextId(),...data,tags:[],assignees:["me"],notaVinculada:null,criadoEm:now,concluido:data.coluna==="feito"});}
  closeAll();render();push();
};
document.getElementById("btnDelete").onclick=()=>{const id=document.getElementById("f_id").value;
  DB.tarefas=DB.tarefas.filter(x=>x.id!==id);closeAll();render();push();};
document.getElementById("btnNew").onclick=()=>openTask(null,"todo");
document.getElementById("btnCancelTask").onclick=closeAll;

/* =================== config =================== */
const scrimCfg=document.getElementById("scrimCfg");
document.getElementById("railCfg").onclick=()=>{
  document.getElementById("c_boardName").value=DB?.board?.nome||"";
  scrimCfg.classList.add("open");};
document.getElementById("btnCancelCfg").onclick=closeAll;
document.getElementById("btnSaveCfg").onclick=()=>{
  if(DB){DB.board.nome=document.getElementById("c_boardName").value.trim()||"Board";
    closeAll();render();push();}};

function closeAll(){scrimTask.classList.remove("open");scrimCfg.classList.remove("open");}
[scrimTask,scrimCfg].forEach(s=>s.addEventListener("click",e=>{if(e.target===s)closeAll();}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll();});
document.getElementById("search").addEventListener("input",e=>{Q=e.target.value.toLowerCase().trim();render();});

/* =================== painel direito =================== */
function renderActivity(){
  const heat=document.getElementById("heat");
  const lv=[0,1,2,3];const cols=["#161b24","#1e3a5f","#2f6bff","#7aa2ff"];
  let html="";for(let i=0;i<42;i++){const v=lv[Math.floor(Math.abs(Math.sin(i*1.7))*4)%4];
    html+=`<i style="background:${cols[v]};animation:cardIn .4s ${i*.012}s var(--ease) both"></i>`;}
  heat.innerHTML=html;
  const feed=document.getElementById("feed");
  feed.innerHTML=(DB.atividade||[]).map((a,i)=>{const p=a.pessoa==="system"?{nome:"SY",cor:"#2a3340"}:person(a.pessoa);
    const av=a.pessoa==="system"
      ?`<span class="av" style="background:#1a2030"><svg fill="none" stroke="#9aa3b2" stroke-width="1.8" viewBox="0 0 24 24" width="15" height="15"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></span>`
      :`<span class="av" style="background:${p.cor}">${initials(p.nome)}</span>`;
    return`<div class="item" style="animation-delay:${.1+i*.06}s">${av}
      <div class="body"><div class="top"><span class="nm">${a.pessoa==="system"?"System":esc(p.nome)}</span><span class="tm">${a.hora}</span></div>
      <div class="tx">${esc(a.acao)} <b>${esc(a.alvo)}</b> ${esc(a.extra||"")}</div></div></div>`;}).join("");
}

/* timer */
let running=true,sec=3*3600+37*60+52;
function tick(){if(!running)return;sec++;const h=String(Math.floor(sec/3600)).padStart(2,"0");
  const m=String(Math.floor(sec%3600/60)).padStart(2,"0");const s=String(sec%60).padStart(2,"0");
  document.getElementById("clock").textContent=`${h}:${m}:${s}`;}
setInterval(tick,1000);
document.getElementById("play").onclick=()=>{running=!running;
  document.getElementById("playIcon").innerHTML=running?'<path d="M8 5v14l11-7z"/>':'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';};

/* boot */
(async()=>{await pull();renderActivity();})();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
